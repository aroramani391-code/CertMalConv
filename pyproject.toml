[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certmalconv"
version = "0.3.2"
description = "Efficient and certifiably robust multi-modal malware detection"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [
    { name = "First A. Author" },
    { name = "Second B. Author" },
    { name = "Third C. Author" },
]
keywords = [
    "malware-detection",
    "certified-robustness",
    "multi-modal",
    "content-defined-chunking",
    "graph-neural-networks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "torch>=2.3,<2.4",
    "torch-geometric>=2.5,<2.6",
    "numpy>=1.26,<2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lief>=0.14",
    "capstone>=5.0",
    "pefile>=2024.8.26",
    "pyelftools>=0.31",
    "python-tlsh>=4.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
certmalconv-train    = "certmalconv.training.train:cli"
certmalconv-eval     = "certmalconv.evaluation.cli:main"
certmalconv-verify   = "certmalconv.certification.certificate_verifier:cli"
certmalconv-attack   = "certmalconv.attacks.cli:main"

[project.urls]
Homepage      = "https://certmalconv.github.io"
Repository    = "https://github.com/certmalconv/certmalconv"
Documentation = "https://certmalconv.github.io/docs"
Issues        = "https://github.com/certmalconv/certmalconv/issues"
Zenodo        = "https://doi.org/10.5281/zenodo.14258123"

[tool.setuptools.packages.find]
where = ["src"]
include = ["certmalconv*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["baselines/*/vendor/"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP", "SIM", "RUF"]
ignore = ["E501"]  # handled by black

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["baselines/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: tests that take > 30 s",
    "full: full-scale experiments (takes hours)",
]
